<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Dhaka Crime Map</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body { display: block; overflow-y: auto; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .top h1 { margin: 0; font-size: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  input, textarea, select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  textarea { width: 100%; min-height: 120px; }
  pre { white-space: pre-wrap; font-size: 12px; background: var(--surface-2); border-radius: 8px; padding: 8px; max-height: 360px; overflow: auto; }
  .st-complete { color: #0a8a0a; } .st-partial, .st-failed { color: #c0392b; } .st-processing { color: #b7791f; } .st-not_collected { color: var(--muted); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Dhaka Crime Map · Admin</h1>
    <div class="row">
      <span class="muted" id="who"></span>
      <a class="link" href="/review">Review</a>
      <a class="link" href="/docs">API docs</a>
      <button class="btn ghost" id="logout" type="button">Log out</button>
    </div>
  </div>

  <div class="grid2">
    <section class="card">
      <h2>Status</h2>
      <dl class="kv" id="status"></dl>
    </section>
    <section class="card">
      <h2>Collect now</h2>
      <div class="row">
        <label>Days back <input id="days" type="number" min="0" max="90" value="1" style="width:6em"></label>
        <label>Max articles <input id="max" type="number" min="1" max="5000" placeholder="default" style="width:8em"></label>
        <button class="btn" id="collect" type="button">Collect</button>
      </div>
      <p class="muted" id="collect-msg"></p>
    </section>
  </div>

  <section class="card">
    <h2>Coverage <select id="cov-days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></h2>
    <p id="cov-summary"></p>
    <div style="overflow:auto"><table id="coverage"></table></div>
  </section>

  <section class="card">
    <h2>Event matching (same crime in several papers) <select id="ev-outcome"><option value="linked">merged</option><option value="new_event">new events</option><option value="ambiguous">ambiguous</option><option value="error">errors</option><option value="split">split by admin</option></select></h2>
    <p id="ev-status" class="muted"></p>
    <div class="row"><label>Merge event <input id="ev-keep" type="number" style="width:7em"></label>
      <label>with event <input id="ev-other" type="number" style="width:7em"></label>
      <button class="btn" id="ev-merge" type="button">Merge</button> <span class="muted" id="ev-msg"></span></div>
    <div style="overflow:auto"><table id="ev-list"></table></div>
  </section>

  <section class="card">
    <h2>Recent runs</h2>
    <div style="overflow:auto"><table id="runs"></table></div>
  </section>

  <section class="card">
    <h2>Try an article (nothing is published)</h2>
    <div class="row"><input id="t-title" placeholder="Title" style="flex:1"></div>
    <div class="row"><textarea id="t-body" placeholder="Article text"></textarea></div>
    <div class="row">
      <label>Published <input id="t-date" type="datetime-local"></label>
      <button class="btn" id="try" type="button">Ask Gemma</button>
    </div>
    <pre id="t-out" hidden></pre>
  </section>
</div>
<script src="/admin-static/admin.js"></script>
</body>
</html>

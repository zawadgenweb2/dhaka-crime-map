<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pre" content="{{PRE}}">
<title>Admin login · Dhaka Crime Map</title>
<style>
  :root { --ink:#16191d; --muted:#5b6470; --line:#d9ddd6; --bg:#f4f5f2; --surface:#fff; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8e8e3; --muted:#9a9890; --line:#2c2c2a; --bg:#121211; --surface:#1c1c1b; --accent:#3987e5; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, "Noto Sans Bengali", sans-serif; padding: 16px; }
  form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; }
  button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  #err { color: #d03b3b; min-height: 1.5em; font-size: 14px; margin: 0; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Dhaka Crime Map · Admin</h1>
  <label>Username <input id="u" name="username" autocomplete="username" required></label>
  <label>Password <input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
  <p id="err" role="alert"></p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pre = document.querySelector('meta[name="pre"]').content;
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-CSRF-Token": pre },
    body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
  if (r.ok) { location.href = "/"; return; }
  const msg = (await r.json().catch(() => ({}))).detail || `Error ${r.status}`;
  document.getElementById("err").textContent = msg;
  if (r.status === 403) setTimeout(() => location.reload(), 1200);
});
</script>
</body>
</html>

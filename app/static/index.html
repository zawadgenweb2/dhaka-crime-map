<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলাদেশ অপরাধ মানচিত্র</title>
<meta name="description" content="Prothom Alo crime reports in Dhaka, classified and mapped by neighbourhood.">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1 data-i18n="title">বাংলাদেশ অপরাধ মানচিত্র</h1>
      <p class="sub" id="status-line">…</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="lang-btn" class="btn ghost" type="button" aria-label="Language">EN</button>
  </div>
</header>

<main class="layout">
  <aside class="panel filters" id="panel-filters">
    <section>
      <h2 data-i18n="period">সময়কাল</h2>
      <div class="seg" id="period">
        <button data-days="7" type="button" class="on">৭ দিন</button>
        <button data-days="30" type="button">৩০ দিন</button>
        <button data-days="90" type="button">৯০ দিন</button>
        <button data-days="365" type="button">১ বছর</button>
      </div>
      <div class="dates">
        <label><span data-i18n="from">শুরু</span><input type="date" id="start"></label>
        <label><span data-i18n="to">শেষ</span><input type="date" id="end"></label>
      </div>
    </section>
    <section>
      <div class="row-between">
        <h2 data-i18n="crimeType">অপরাধের ধরন</h2>
        <button class="link" id="cats-all" type="button" data-i18n="all">সব</button>
      </div>
      <div class="chips" id="cats"></div>
    </section>
    <section>
      <h2 data-i18n="district">জেলা</h2>
      <select id="district" aria-label="District"></select>
      <select id="thana" aria-label="Thana / upazila" hidden style="margin-top:8px"></select>
    </section>
    <section>
      <h2 data-i18n="mapView">মানচিত্র</h2>
      <div class="seg" id="mode">
        <button data-mode="heat" type="button" class="on" data-i18n="heat">হিটম্যাপ</button>
        <button data-mode="both" type="button" data-i18n="both">দুটোই</button>
        <button data-mode="points" type="button" data-i18n="points">ঘটনা</button>
      </div>
    </section>
    <section class="tiles" id="tiles"></section>
    <section>
      <h2 data-i18n="hotspots">সবচেয়ে বেশি ঘটনা</h2>
      <ol class="rank" id="rank"></ol>
    </section>
    <section>
      <h2 data-i18n="timeOfDay">দিনের কোন সময়ে</h2>
      <div class="hbars" id="tod"></div>
    </section>
    <section>
      <h2 data-i18n="daily">প্রতিদিনের ঘটনা</h2>
      <div class="trend" id="trend"></div>
    </section>
  </aside>

  <section class="mapwrap">
    <div id="map" role="region" aria-label="Crime map"></div>
    <div class="legend" id="legend"></div>
    <div class="zoomctl" role="group" aria-label="Zoom">
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
      <button id="zoom-reset" type="button" aria-label="Show all of Dhaka" title="Show all of Dhaka">⌂</button>
    </div>
    <div class="tooltip" id="tooltip" hidden></div>
    <article class="card selected" id="selected" hidden></article>
    <div class="map-note" id="map-note" hidden></div>
  </section>

  <aside class="panel feed">
    <div class="row-between">
      <h2 data-i18n="reports">প্রতিবেদন</h2>
      <span class="muted" id="feed-count"></span>
    </div>
    <ul class="feed-list" id="feed"></ul>
  </aside>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="filters" type="button" data-i18n="tabFilters">ফিল্টার ও পরিসংখ্যান</button>
  <button data-tab="map" type="button" class="on" data-i18n="tabMap">মানচিত্র</button>
  <button data-tab="feed" type="button" data-i18n="tabFeed">প্রতিবেদন</button>
</nav>

<script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
<script src="/static/heat-paint.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

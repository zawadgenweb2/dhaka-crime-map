# Dhaka Crime Map - microservices
#   docker compose up -d --build              start db, api, collector, classifier
#   docker compose --profile test run --rm test
# Secrets come from .env (git-ignored). Only the classifier receives model credentials.
name: dhaka-crime-map

x-app: &app
  image: dhaka-crime-map:latest     # built once by the `migrate` service
  pull_policy: never
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
  logging: { driver: local }

x-db-url: &db-url
  DATABASE_URL: postgresql://dcm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dcm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcm
      POSTGRES_DB: dcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcm -d dcm"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: base }
    image: dhaka-crime-map:latest
    command: ["migrate"]
    environment: { <<: *db-url }
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *db-url
      HOST: 0.0.0.0
      PORT: "8100"
      SCRAPE_TIMES: ${SCRAPE_TIMES:-08:00,20:00}
      CLASSIFIER: ${CLASSIFIER:-claude}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ALLOW_UI_TRIGGER: ${ALLOW_UI_TRIGGER:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${PORT:-8100}:8100"   # loopback only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    <<: *app
    command: ["collector"]
    environment:
      <<: *db-url
      SCRAPE_TIMES: ${SCRAPE_TIMES:-08:00,20:00}
      CLASSIFIER: ${CLASSIFIER:-claude}
      USER_AGENT: ${USER_AGENT:-DhakaCrimeMap/0.2 (research prototype)}
      MAX_ARTICLES_PER_RUN: ${MAX_ARTICLES_PER_RUN:-150}

  classifier:
    <<: *app
    command: ["classifier"]
    environment:
      <<: *db-url
      CLASSIFIER: ${CLASSIFIER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-medium}
      CLASSIFY_CONCURRENCY: ${CLASSIFY_CONCURRENCY:-3}
      MAX_LLM_CALLS_PER_DAY: ${MAX_LLM_CALLS_PER_DAY:-200}
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://ollama:11434/v1}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:e2b}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-true}
      USER_AGENT: ${USER_AGENT:-DhakaCrimeMap/0.2 (research prototype)}

  test:
    build: { context: ., target: test }
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://dcm:${POSTGRES_PASSWORD}@db:5432/dcm_test
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:

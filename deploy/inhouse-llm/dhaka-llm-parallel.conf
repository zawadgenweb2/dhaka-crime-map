# systemd drop-in for dhaka-llm.service: parallel request slots on the 12 GB in-house GPU (RTX 3080 Ti).
# Install: mkdir -p ~/.config/systemd/user/dhaka-llm.service.d && cp dhaka-llm-parallel.conf \
#          ~/.config/systemd/user/dhaka-llm.service.d/parallel.conf && systemctl --user daemon-reload && systemctl --user restart dhaka-llm
# Context is shared by the slots: 49152 / 4 = 12288 tokens each (longest request seen in two days of logs: about 10,100 tokens; none truncated).
# Classifier threads (CLASSIFY_CONCURRENCY) should be one fewer than the slots, so the event matcher always has one.
[Service]
Environment=DHAKA_LLM_PARALLEL=4
Environment=DHAKA_LLM_CTX=49152
